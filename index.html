<!DOCTYPE html>
<html lang="ru" data-theme="pink">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ec4899" id="metaThemeColor" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Новая Я — Персональный трекер</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-512.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <style>
    :root, [data-theme="pink"] {
      --bg-grad: linear-gradient(180deg, #ffeaf2 0%, #fff7fa 50%, #fff0f6 100%);
      --card: #ffffff;
      --surface: #fdf2f8;
      --surface-2: #fce7f3;
      --border: #fbcfe8;
      --primary: #ec4899;
      --primary-dark: #db2777;
      --primary-deep: #be185d;
      --primary-soft: #f9a8d4;
      --header-grad: linear-gradient(135deg, #ec4899 0%, #f472b6 100%);
      --text: #3b1d2a;
      --muted: #8c5a70;
      --shadow: 0 8px 24px rgba(236, 72, 153, 0.12);
      --chart-grid: #fce7f3;
      --success: #10b981;
      --danger: #ef4444;
    }
    [data-theme="black"] {
      --bg-grad: linear-gradient(180deg, #09090b 0%, #121216 50%, #09090b 100%);
      --card: #18181b;
      --surface: #27272a;
      --surface-2: #3f3f46;
      --border: #3f3f46;
      --primary: #f43f5e;
      --primary-dark: #e11d48;
      --primary-deep: #fda4af;
      --primary-soft: #881337;
      --header-grad: linear-gradient(135deg, #18181b 0%, #27272a 100%);
      --text: #fafafa;
      --muted: #a1a1aa;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      --chart-grid: #27272a;
      --success: #34d399;
      --danger: #fb7185;
    }
    [data-theme="blue"] {
      --bg-grad: linear-gradient(180deg, #e0f2fe 0%, #f0f9ff 50%, #e0f2fe 100%);
      --card: #ffffff;
      --surface: #f0f9ff;
      --surface-2: #e0f2fe;
      --border: #bae6fd;
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --primary-deep: #075985;
      --primary-soft: #7dd3fc;
      --header-grad: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      --text: #0c4a6e;
      --muted: #527991;
      --shadow: 0 8px 24px rgba(2, 132, 199, 0.12);
      --chart-grid: #e0f2fe;
      --success: #10b981;
      --danger: #ef4444;
    }
    [data-theme="purple"] {
      --bg-grad: linear-gradient(180deg, #f3e8ff 0%, #faf5ff 50%, #f3e8ff 100%);
      --card: #ffffff;
      --surface: #faf5ff;
      --surface-2: #f3e8ff;
      --border: #e9d5ff;
      --primary: #9333ea;
      --primary-dark: #7e22ce;
      --primary-deep: #6b21a8;
      --primary-soft: #d8b4fe;
      --header-grad: linear-gradient(135deg, #9333ea 0%, #c084fc 100%);
      --text: #3b0764;
      --muted: #7e5a9b;
      --shadow: 0 8px 24px rgba(147, 51, 234, 0.12);
      --chart-grid: #f3e8ff;
      --success: #10b981;
      --danger: #ef4444;
    }
    [data-theme="green"] {
      --bg-grad: linear-gradient(180deg, #dcfce7 0%, #f0fdf4 50%, #dcfce7 100%);
      --card: #ffffff;
      --surface: #f0fdf4;
      --surface-2: #dcfce7;
      --border: #bbf7d0;
      --primary: #16a34a;
      --primary-dark: #15803d;
      --primary-deep: #166534;
      --primary-soft: #86efac;
      --header-grad: linear-gradient(135deg, #16a34a 0%, #4ade80 100%);
      --text: #14532d;
      --muted: #4d7c5f;
      --shadow: 0 8px 24px rgba(22, 163, 74, 0.12);
      --chart-grid: #dcfce7;
      --success: #059669;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg-grad);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    body { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }

    header {
      background: var(--header-grad);
      color: #fff;
      padding: calc(14px + env(safe-area-inset-top)) 16px 18px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      position: sticky;
      top: 0;
      z-index: 25;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 760px;
      margin: 0 auto;
      gap: 10px;
    }
    .brand h1 { font-size: 1.18rem; font-weight: 800; letter-spacing: -0.02em; }
    .brand p { font-size: 0.76rem; opacity: 0.92; margin-top: 2px; }
    .btn-header {
      background: rgba(255,255,255,0.22);
      border: 1px solid rgba(255,255,255,0.45);
      color: #fff;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      min-height: 40px;
    }
    .btn-header:active { transform: scale(0.96); }

    .container { max-width: 760px; margin: 0 auto; padding: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .card-title {
      font-size: 0.98rem;
      font-weight: 800;
      color: var(--primary-deep);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    @media (min-width: 640px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 11px 8px;
      text-align: center;
    }
    .stat-label { font-size: 0.7rem; color: var(--muted); font-weight: 600; }
    .stat-val { font-size: 1.24rem; font-weight: 800; color: var(--primary); margin: 3px 0 2px; }
    .stat-sub { font-size: 0.68rem; color: var(--muted); }

    .eta-banner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
    }

    .progress-wrap {
      background: var(--surface-2);
      height: 14px;
      border-radius: 999px;
      overflow: hidden;
      margin: 8px 0;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-dark));
      border-radius: 999px;
      transition: width 0.4s ease;
    }
    .kg-bubbles { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .kg-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 0.68rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .kg-dot.done {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      border-color: var(--primary-dark);
    }

    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input, select, textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 0.92rem;
      color: var(--text);
      background: var(--card);
